# Integration tests against Qdrant and Redis (requires Docker service containers).
name: Integration CI

on:
  push:
    branches: [main, develop]
    paths:
      - "tests/integration/**"
      - "src/**"
      - "scripts/wait-for-services.sh"
      - ".github/workflows/integration-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "tests/integration/**"
      - "src/**"
      - "scripts/wait-for-services.sh"
      - ".github/workflows/integration-ci.yml"

concurrency:
  group: integration-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  QDRANT_HOST: localhost
  QDRANT_PORT: "6333"
  REDIS_URL: redis://localhost:6379/0

jobs:
  integration:
    name: Python · Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Wait for service containers
        run: bash scripts/wait-for-services.sh

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v -m integration --tb=short
