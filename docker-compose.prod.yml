# ──────────────────────────────────────────────
# Drishti — दृष्टि
# Production Docker Compose (US-12.02)
# ──────────────────────────────────────────────
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required environment variables (set in .env.prod):
#   - POSTGRES_PASSWORD
#   - MINIO_ROOT_USER
#   - MINIO_ROOT_PASSWORD
#   - NEO4J_PASSWORD
#   - ANTHROPIC_API_KEY (or OPENAI_API_KEY)
#   - JWT_SECRET_KEY
#
# ═══════════════════════════════════════

services:
  # ─── Drishti API ───────────────────────
  drishti-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drishti-api
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://drishti:${POSTGRES_PASSWORD}@postgres:5432/drishti
      
      # Vector Database
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      
      # Cache
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: "true"
      
      # Object Storage
      ENABLE_MINIO: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      
      # Graph Database
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_ENABLED: "true"
      
      # LLM/Embedding
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      
      # Auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      API_TOKEN: ${API_TOKEN:-}
      
      # Observability
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      STRUCTURED_LOGGING: "true"
      LOG_JSON: "true"
      LOG_LEVEL: INFO
      
      # App
      DEBUG: "false"
    volumes:
      - drishti_workspaces:/app/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ─── Drishti Web (Next.js) ─────────────
  drishti-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: drishti-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_DRISHTI_API_URL: http://drishti-api:8000
    depends_on:
      - drishti-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ─── Vector Database ─────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: drishti-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ─── Cache ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: drishti-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M

  # ─── PostgreSQL ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: drishti-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: drishti
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti -d drishti"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ─── Object Storage (S3-compatible) ─
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: drishti-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ─── Graph Database ──────────────────
  neo4j:
    image: neo4j:5-community
    container_name: drishti-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

volumes:
  drishti_workspaces:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  minio_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  default:
    name: drishti-network
    driver: bridge
