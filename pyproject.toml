[project]
name = "drishti"
version = "0.1.0"
description = "दृष्टि — Multi-modal, AST-aware RAG system for code & document understanding"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Abhishek Kumar", email = "abhishekkumar@example.com" },
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "tree-sitter",
    "ast",
    "code-search",
    "semantic-search",
    "vector-database",
    "hybrid-search",
    "pdf-parsing",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",

    # Vector Database
    "qdrant-client>=1.12.0",

    # Embeddings & LLM
    "openai>=1.55.0",
    "anthropic>=0.39.0",
    "cohere>=5.11.0",

    # AST Parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-typescript>=0.23.0",

    # PDF Parsing
    "pymupdf>=1.24.0",

    # Data & Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "redis>=5.2.0",

    # Utilities
    "rich>=13.9.0",
    "gitpython>=3.1.43",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]

eval = [
    "ragas>=0.2.0",
    "datasets>=3.1.0",
    "pandas>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/Abhishekkumar2021/Drishti"
Documentation = "https://github.com/Abhishekkumar2021/Drishti/tree/main/docs"
Repository = "https://github.com/Abhishekkumar2021/Drishti"
Issues = "https://github.com/Abhishekkumar2021/Drishti/issues"

[project.scripts]
drishti = "drishti.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ──────────────────────────────────────────────
# Tool Configuration
# ──────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["drishti"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "tree_sitter.*",
    "tree_sitter_python.*",
    "tree_sitter_java.*",
    "tree_sitter_javascript.*",
    "tree_sitter_go.*",
    "tree_sitter_typescript.*",
    "pymupdf.*",
    "fitz.*",
    "cohere.*",
    "qdrant_client.*",
    "redis.*",
    "ragas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require Qdrant, Redis, etc.)",
    "e2e: End-to-end tests (full pipeline)",
    "slow: Slow tests (skip with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/drishti"]
omit = ["tests/*", "benchmarks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 70
