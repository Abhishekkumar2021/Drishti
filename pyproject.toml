[project]
name = "drishti"
version = "0.1.0"
description = "दृष्टि — Multi-modal, AST-aware RAG system for code & document understanding"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Abhishek Kumar", email = "abhishekkumar@example.com" },
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "tree-sitter",
    "ast",
    "code-search",
    "semantic-search",
    "vector-database",
    "hybrid-search",
    "pdf-parsing",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",

    # Vector Database
    "qdrant-client>=1.12.0",

    # Embeddings & LLM
    "openai>=1.55.0",
    "anthropic>=0.39.0",
    "cohere>=5.11.0",

    # AST Parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-typescript>=0.23.0",

    # PDF Parsing
    "pymupdf>=1.24.0",
    "pyyaml>=6.0.0",

    # Data & Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "redis>=5.2.0",

    # Utilities
    "rich>=13.9.0",
    "gitpython>=3.1.43",
    "python-dotenv>=1.0.1",

    # Platform V2 — data plane, observability, agent
    "structlog>=24.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "alembic>=1.14.0",
    "minio>=7.2.12",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "langchain-core>=0.3.29",
    "arq>=0.26.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]

eval = [
    "ragas>=0.2.0",
    "datasets>=3.1.0",
    "pandas>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/Abhishekkumar2021/Drishti"
Documentation = "https://github.com/Abhishekkumar2021/Drishti/tree/main/docs"
Repository = "https://github.com/Abhishekkumar2021/Drishti"
Issues = "https://github.com/Abhishekkumar2021/Drishti/issues"

[project.scripts]
drishti = "drishti.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drishti"]

[tool.hatch.build.targets.wheel.force-include]
"src/drishti/ingestion/queries" = "drishti/ingestion/queries"

# ──────────────────────────────────────────────
# Tool Configuration
# ──────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D102", "D103", "TC001", "TC003"]
"tests/integration/**/*.py" = ["TC002"]
"src/drishti/ingestion/ast/*.py" = ["TC002"]
"src/drishti/ingestion/chunk_index.py" = ["TC003"]
"src/drishti/ingestion/git_changes.py" = ["TC002", "TC003"]
"src/drishti/ingestion/incremental.py" = ["TC001", "TC003"]
"src/drishti/ingestion/index_state.py" = ["TC003"]
"src/drishti/embedding/pipeline.py" = ["TC001"]
"src/drishti/storage/qdrant_store.py" = ["TC001", "TC003"]
"src/drishti/search/dense.py" = ["TC001"]
"src/drishti/search/sparse.py" = ["TC001"]
"src/drishti/search/pipeline.py" = ["TC001"]
"src/drishti/search/factory.py" = ["TC001", "TC003"]
"src/drishti/search/expansion.py" = ["TC001", "TC003", "ANN401", "D107"]
"src/drishti/search/rerank.py" = ["TC001", "TC003", "ANN401"]
"src/drishti/search/rrf.py" = ["TC001"]
"src/drishti/embedding/dense.py" = ["TC002"]
"src/drishti/embedding/factory.py" = ["TC003"]
"src/drishti/embedding/cohere_dense.py" = ["TC003", "ANN401", "D102", "D107"]
"src/drishti/embedding/ollama_dense.py" = ["TC003", "D102", "D107"]
"src/drishti/embedding/openai_compatible.py" = ["TC003", "D102", "D107"]
"src/drishti/generation/context.py" = ["TC001", "TC003", "D107"]
"src/drishti/generation/pipeline.py" = ["TC001", "TC003", "D107"]
"src/drishti/generation/llm.py" = ["TC003", "ANN401", "D102", "D107"]
"src/drishti/generation/factory.py" = ["TC003"]
"src/drishti/generation/rag_factory.py" = ["TC001", "TC003"]
"src/drishti/generation/streaming.py" = ["TC003"]
"src/drishti/generation/citations.py" = ["TC003"]
"src/drishti/generation/models.py" = ["TC003"]
"src/drishti/api/schemas.py" = ["TC003", "D102"]
"src/drishti/config.py" = ["D102"]
"src/drishti/exceptions.py" = ["D107"]
"src/drishti/main.py" = ["TC002", "TC003"]
"src/drishti/api/routes.py" = ["TC001", "TC002", "TC003", "B008"]
"src/drishti/api/deps.py" = ["TC001", "TC002", "TC003"]
"src/drishti/api/mappers.py" = ["TC001", "TC003"]
"src/drishti/services/wiring.py" = ["TC001", "TC003"]
"src/drishti/services/query_cache.py" = ["TC003", "D102", "D107"]
"src/drishti/middleware/rate_limit.py" = ["TC003"]
"src/drishti/middleware/*.py" = ["TC002", "TC003", "D102", "D107"]
"src/drishti/services/health.py" = ["TC001"]
"src/drishti/db/*.py" = ["TC001", "TC003"]
"src/drishti/observability/*.py" = ["TC003", "ANN401"]
"src/drishti/agent/*.py" = ["TC001", "TC003", "D102", "D107"]
"src/drishti/storage/artifacts.py" = ["TC003", "TC001", "D102", "D107"]
"src/drishti/worker/*.py" = ["TC003", "ANN401"]
"src/drishti/api/platform_routes.py" = ["TC001", "TC002", "TC003", "B008", "D103", "ANN201"]
"src/drishti/api/platform_schemas.py" = ["TC003", "TC001", "D101"]
"src/drishti/services/platform_service.py" = ["TC001", "TC002", "TC003", "SLF001", "D102", "D105"]
"src/drishti/services/workspace_store.py" = ["TC003", "D102", "D107"]
"src/drishti/services/conversation_store.py" = ["TC003", "D102", "D107"]
"src/drishti/services/memory_store.py" = ["TC003", "D102", "D107"]
"src/drishti/ingestion/content_router.py" = ["TC003", "D102", "D107", "SIM102", "E501"]
"src/drishti/ingestion/documents/*.py" = ["TC003", "D102", "D107", "ANN401", "TC001"]
"src/drishti/utils/workspace_git.py" = ["TC003"]
"src/drishti/utils/github.py" = ["TC003", "D103"]
"tests/unit/test_platform_service.py" = ["ANN001"]
"tests/unit/test_agent_graph.py" = ["ANN001"]
"alembic/**/*.py" = ["D103", "ANN201"]
"scripts/**/*.py" = ["D103", "ANN201"]
"benchmarks/**/*.py" = ["D100", "D101", "D102", "D103", "D107", "ANN001", "ANN201", "ANN401", "TC001", "TC002", "TC003", "E501"]
"playground/**/*.py" = ["D100", "D101", "D102", "D103", "D107", "ANN001", "ANN201", "ANN401", "TC001", "TC002", "TC003", "E501", "B005", "F841", "SIM105", "RUF013", "W293"]
"playground/**/*.ipynb" = ["D100", "D101", "D102", "D103", "D107", "ANN001", "ANN201", "ANN401", "TC001", "TC002", "TC003", "E501", "B005", "F841", "SIM105", "RUF013", "W293"]
"tests/unit/test_evaluation.py" = ["ANN001", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["drishti"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "tree_sitter.*",
    "tree_sitter_python.*",
    "tree_sitter_java.*",
    "tree_sitter_javascript.*",
    "tree_sitter_go.*",
    "tree_sitter_typescript.*",
    "pymupdf.*",
    "fitz.*",
    "cohere.*",
    "qdrant_client.*",
    "redis.*",
    "redis.asyncio.*",
    "ragas.*",
    "ragas.metrics.*",
    "datasets.*",
    "structlog.*",
    "sqlalchemy.*",
    "asyncpg.*",
    "alembic.*",
    "minio.*",
    "langgraph.*",
    "langgraph.checkpoint.*",
    "psycopg.*",
    "langchain_core.*",
    "arq.*",
    "yaml",
    "pandas.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis", "redis.asyncio"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "drishti.ingestion.documents.*",
    "drishti.ingestion.content_router",
    "drishti.services.conversation_store",
    "drishti.services.memory_store",
    "drishti.services.workspace_store",
    "drishti.services.query_cache",
    "drishti.services.health",
    "drishti.middleware.rate_limit",
    "drishti.observability.logging",
]
disable_error_code = ["call-arg", "no-untyped-call", "import-untyped", "unused-ignore", "no-any-return"]

[[tool.mypy.overrides]]
module = ["benchmarks.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require Qdrant, Redis, etc.)",
    "e2e: End-to-end tests (full pipeline)",
    "slow: Slow tests (skip with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/drishti"]
omit = ["tests/*", "benchmarks/*"]

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", "notebooks", "playground"]
skips = ["B101", "B104", "B112"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 70
