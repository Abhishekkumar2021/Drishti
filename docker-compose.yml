# ──────────────────────────────────────────────
# Drishti — दृष्टि
# Multi-modal, AST-aware RAG system
# ──────────────────────────────────────────────

# ═══════════════════════════════════════
# Docker Compose — Local Development
# ═══════════════════════════════════════

services:
  # ─── Vector Database ─────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: drishti-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Cache ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: drishti-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── PostgreSQL (system of record) ─
  postgres:
    image: postgres:16-alpine
    container_name: drishti-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: drishti
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti -d drishti"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Object storage (S3-compatible) ─
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: drishti-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ─── Local LLM / Embeddings (Ollama) ─
  ollama:
    image: ollama/ollama:0.6.5
    container_name: drishti-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ─── Graph Database (Phase 4) ───────
  # Uncomment when starting EPIC-09: Dependency Graph
  #
  # neo4j:
  #   image: neo4j:5-community
  #   container_name: drishti-neo4j
  #   ports:
  #     - "7474:7474"   # Browser
  #     - "7687:7687"   # Bolt
  #   volumes:
  #     - neo4j_data:/data
  #   environment:
  #     NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
  #     NEO4J_PLUGINS: '["apoc"]'
  #   healthcheck:
  #     test: ["CMD", "neo4j", "status"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 5
  #   restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  minio_data:
    driver: local
  ollama_data:
    driver: local
  # neo4j_data:
  #   driver: local
