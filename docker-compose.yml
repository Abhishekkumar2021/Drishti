# ──────────────────────────────────────────────
# Drishti — दृष्टि
# Multi-modal, AST-aware RAG system
# ──────────────────────────────────────────────

# ═══════════════════════════════════════
# Docker Compose — Local Development
# ═══════════════════════════════════════

services:
  # ─── Vector Database ─────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: drishti-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Cache ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: drishti-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Graph Database (Phase 4) ───────
  # Uncomment when starting EPIC-09: Dependency Graph
  #
  # neo4j:
  #   image: neo4j:5-community
  #   container_name: drishti-neo4j
  #   ports:
  #     - "7474:7474"   # Browser
  #     - "7687:7687"   # Bolt
  #   volumes:
  #     - neo4j_data:/data
  #   environment:
  #     NEO4J_AUTH: neo4j/drishtidev
  #     NEO4J_PLUGINS: '["apoc"]'
  #   healthcheck:
  #     test: ["CMD", "neo4j", "status"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 5
  #   restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local
